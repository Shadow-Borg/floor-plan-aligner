<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Site Plan Adjuster</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Building Plan Aligner">
<meta name="theme-color" content="#f4f5f7">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1b1f24;--mute:#5d6673;--line:#d5d9df;--acc:#0b6bcb;--ok:#1a7f37;--warn:#b45309;--bad:#c62828}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
header{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--card);border-bottom:1px solid var(--line);z-index:5}
header .ttl{flex:1;min-width:0;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .ttl small{display:block;font-weight:400;color:var(--mute);font-size:12px}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 12px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.danger{color:var(--bad)}
button:disabled{opacity:.4}
.badge{display:inline-block;min-width:20px;padding:0 5px;margin-left:4px;border-radius:10px;background:var(--acc);color:#fff;font-size:12px;line-height:20px;text-align:center}
.badge.bad{background:var(--bad)}
canvas{position:fixed;top:52px;left:0;width:100vw;height:calc(100% - 52px);touch-action:none;background:#fff;display:block}
#empty{position:fixed;inset:52px 0 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:var(--bg);z-index:2}
#empty p{max-width:340px;margin:0;color:var(--mute)}
.sheet{position:fixed;left:8px;right:8px;max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:14px;z-index:10;max-height:calc(100% - 76px);overflow:auto;display:none}
.sheet.top{top:60px}.sheet.bottom{bottom:10px}
.sheet h3{margin:0 0 8px;font-size:16px}
.sheet .hint{color:var(--mute);font-size:13px;margin:8px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.big{display:block;width:100%;text-align:left;padding:10px 12px;font-size:20px;font-weight:600}
.big small{display:block;font-size:12px;font-weight:400;color:var(--mute)}
label.f{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input[type=text],select{width:100%;font:inherit;min-height:46px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input.num{font-size:24px;font-weight:600}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:2px 0}.kv b{font-weight:600}
.chip{display:inline-block;padding:8px 12px;margin:0 6px 6px 0;border:1px solid var(--line);border-radius:20px;font-size:14px;cursor:pointer;user-select:none}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:9px 4px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--mute);font-weight:500}
tr.c td{color:var(--bad)}
.lay{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px}.lay span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lay select{width:130px;min-height:38px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1b1f24;color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;max-width:90vw;z-index:20;display:none;text-align:center}
.menu button{display:block;width:100%;text-align:left;margin-bottom:8px}
#print{display:none}
#print h1{font-size:20px;margin:0 0 4px}#print h2{font-size:15px;margin:14px 0 6px}#print .meta{font-size:12px;color:#444;margin:4px 0}#print svg.plan{display:block;width:100%;max-height:150mm;margin:8px 0}#print table{font-size:12px}#print td,#print th{padding:4px 6px;border:1px solid #999}#print li{font-size:12px;margin-bottom:4px}
@media print{html,body{height:auto;overflow:visible;background:#fff}header,canvas,#empty,.sheet,#toast{display:none!important}#print{display:block;padding:0;color:#000}}
</style>
</head>
<body>
<header>
  <div class="ttl"><span id="pname">Site Plan Adjuster</span><small id="pinfo">No plan open</small></div>
  <button id="bUndo" disabled>Undo</button>
  <button id="bList">List<span class="badge" id="nDims" style="display:none">0</span></button>
  <button id="bMenu">Menu</button>
</header>
<canvas id="cv"></canvas>
<div id="empty">
  <h2 style="margin:0">Site Plan Adjuster</h2>
  <p>Open a DXF plan, tap inside a room, and type the size you measured on site. The plan adjusts itself.</p>
  <button class="pri" id="bOpen0">Open DXF or project file</button>
  <p style="font-size:13px">In AutoCAD use Save As &rarr; DXF to get a DXF from your DWG.</p>
</div>
<div class="sheet" id="sheet"></div>
<div id="toast"></div>
<div id="print"></div>
<input type="file" id="file" hidden>
<script>
'use strict';
/* =====================================================================
   CORE (no DOM): DXF parsing, model building, measuring, stretching
   ===================================================================== */
const UNIT_M={mm:0.001,cm:0.01,m:1,in:0.0254,ft:0.3048};
const UNIT_DP={mm:0,cm:1,m:3,in:2,ft:3};
const epsOf=M=>0.001/UNIT_M[M.unit];            // 1 mm in drawing units

function parseDXF(text){
  const L=text.split(/\r\n|\r|\n/), recs=[];
  let sec=null, rec=null, insunits=0;
  for(let i=0;i+1<L.length;i+=2){
    const c=parseInt(L[i],10), s=L[i+1];
    if(c===0){
      const t=s.trim();
      if(t==='SECTION'){sec=(L[i+3]||'').trim();i+=2;rec=null;continue;}
      if(t==='ENDSEC'){sec=null;rec=null;continue;}
      if(t==='EOF')break;
      if(sec==='BLOCKS'||sec==='ENTITIES'){rec={t,sec,g:[]};recs.push(rec);}else rec=null;
      continue;
    }
    if(sec==='HEADER'){if(c===9&&s.trim()==='$INSUNITS')insunits=parseInt(L[i+3],10)||0;continue;}
    if(rec){
      const v=(c>=10&&c<60)||(c>=110&&c<150)||(c>=210&&c<240)?parseFloat(s):
              (c>=60&&c<100)||(c>=170&&c<180)||(c>=270&&c<290)?parseInt(s,10):s.trim();
      rec.g.push([c,v]);
    }
  }
  const out={insunits,blocks:{},ents:[]};
  let blk=null, poly=null;
  for(const r of recs){
    if(r.t==='BLOCK'){blk={name:String(gv(r,2,'')),bx:gv(r,10,0),by:gv(r,20,0),ents:[]};continue;}
    if(r.t==='ENDBLK'){if(blk)out.blocks[blk.name]=blk;blk=null;continue;}
    const dst=r.sec==='BLOCKS'?(blk?blk.ents:null):out.ents;
    if(!dst)continue;
    if(r.sec==='ENTITIES'&&gv(r,67,0)===1)continue;          // paper space
    if(r.t==='POLYLINE'){const f=gv(r,70,0);poly={t:'P',layer:String(gv(r,8,'0')),pts:[],bl:[],closed:(f&1)===1,skip:(f&80)!==0,dst};continue;}
    if(r.t==='VERTEX'){if(poly){poly.pts.push(gv(r,10,0),gv(r,20,0));poly.bl.push(gv(r,42,0));}continue;}
    if(r.t==='SEQEND'){if(poly&&!poly.skip&&poly.pts.length>=4){const d=poly.dst;delete poly.dst;delete poly.skip;d.push(poly);}poly=null;continue;}
    const e=convertEnt(r);
    if(e)dst.push(e);
  }
  return out;
}
function gv(r,c,d){for(const p of r.g)if(p[0]===c)return p[1];return d;}
function cleanText(s){
  return String(s).replace(/\\P/g,' ').replace(/\\[LlOoKk~]/g,'').replace(/\\[A-Za-z][^;\\{}]*;/g,'')
    .replace(/[{}]/g,'').replace(/%%[cdpCDP]/g,'').replace(/\s+/g,' ').trim();
}
function convertEnt(r){
  const layer=String(gv(r,8,'0')), flip=gv(r,230,1)<0, fx=flip?-1:1;
  switch(r.t){
    case 'LINE':return {t:'L',layer,pts:[gv(r,10,0),gv(r,20,0),gv(r,11,0),gv(r,21,0)]};
    case 'LWPOLYLINE':{
      const pts=[],bl=[];let x=0;
      for(const [c,v] of r.g){
        if(c===10)x=v;else if(c===20){pts.push(fx*x,v);bl.push(0);}
        else if(c===42&&bl.length)bl[bl.length-1]=fx*v;
      }
      return pts.length>=4?{t:'P',layer,pts,bl,closed:(gv(r,70,0)&1)===1}:null;
    }
    case 'ARC':{
      let a1=gv(r,50,0),a2=gv(r,51,360);
      if(flip){const t=a1;a1=180-a2;a2=180-t;}
      return {t:'A',layer,c:[fx*gv(r,10,0),gv(r,20,0)],r:gv(r,40,0),a1,a2};
    }
    case 'CIRCLE':return {t:'A',layer,c:[fx*gv(r,10,0),gv(r,20,0)],r:gv(r,40,0),a1:0,a2:360};
    case 'ELLIPSE':{
      const cx=gv(r,10,0),cy=gv(r,20,0),mx=gv(r,11,1),my=gv(r,21,0),k=gv(r,40,1);
      let u1=gv(r,41,0),u2=gv(r,42,Math.PI*2);if(u2<=u1)u2+=Math.PI*2;
      const pts=[],n=32;
      for(let i=0;i<=n;i++){const u=u1+(u2-u1)*i/n,c=Math.cos(u),s=Math.sin(u);pts.push(cx+c*mx-s*k*my,cy+c*my+s*k*mx);}
      return {t:'P',layer,pts,bl:new Array(pts.length/2).fill(0),closed:false};
    }
    case 'TEXT':{
      const h72=gv(r,72,0),h73=gv(r,73,0),al=(h72||h73)&&gv(r,11,null)!==null;
      const s=cleanText(gv(r,1,''));if(!s)return null;
      return {t:'T',layer,p:[al?gv(r,11,0):gv(r,10,0),al?gv(r,21,0):gv(r,20,0)],h:gv(r,40,1),s,rot:gv(r,50,0),
        ha:h72===1||h72===4?'center':h72===2?'right':'left',va:h73===3?'top':h73===2||h72===4?'middle':'alphabetic'};
    }
    case 'MTEXT':{
      let s='';for(const [c,v] of r.g)if(c===3)s+=v;
      s=cleanText(s+gv(r,1,''));if(!s)return null;
      const at=gv(r,71,1)-1;
      return {t:'T',layer,p:[gv(r,10,0),gv(r,20,0)],h:gv(r,40,1),s,rot:gv(r,50,0),
        ha:['left','center','right'][at%3]||'left',va:['top','middle','bottom'][Math.floor(at/3)]||'top'};
    }
    case 'INSERT':return {t:'I',layer,name:String(gv(r,2,'')),p:[fx*gv(r,10,0),gv(r,20,0)],sx:fx*gv(r,41,1),sy:gv(r,42,1),rot:fx*gv(r,50,0)};
    case 'HATCH':return convertHatch(r,layer);
  }
  return null;
}
function convertHatch(r,layer){
  const paths=[];let cur=null,poly=false,started=false,et=0,arc=null,x=0;
  const flush=()=>{
    if(arc&&arc.r>0&&cur){
      let a1=arc.a1||0,a2=arc.a2||0;
      if(arc.ccw===0){a1=-a1;a2=-a2;if(a2>a1)a2-=360;}else if(a2<a1)a2+=360;
      const n=Math.max(4,Math.ceil(Math.abs(a2-a1)/12));
      for(let i=0;i<n;i++){const a=(a1+(a2-a1)*i/n)*Math.PI/180;cur.push(arc.x+arc.r*Math.cos(a),arc.y+arc.r*Math.sin(a));}
    }
    arc=null;
  };
  for(const [c,v] of r.g){
    if(c===91){started=true;continue;}
    if(!started)continue;
    if(c===75||c===98)break;
    if(c===92){flush();cur=[];paths.push(cur);poly=(v&2)!==0;et=0;continue;}
    if(!cur)continue;
    if(poly){if(c===10)x=v;else if(c===20)cur.push(x,v);}
    else if(c===72){flush();et=v;if(v===2)arc={x:0,y:0};}
    else if(et===1){if(c===10)x=v;else if(c===20)cur.push(x,v);}
    else if(et===2&&arc){if(c===10)arc.x=v;else if(c===20)arc.y=v;else if(c===40)arc.r=v;else if(c===50)arc.a1=v;else if(c===51)arc.a2=v;else if(c===73)arc.ccw=v;}
  }
  flush();
  const good=paths.filter(p=>p.length>=6);
  return good.length?{t:'H',layer,paths:good,solid:gv(r,70,0)===1}:null;
}

/* ---- geometry helpers ---- */
function bulgeMid(x1,y1,x2,y2,b){            // intermediate points of a bulged segment
  const out=[],ex=x2-x1,ey=y2-y1,c=Math.hypot(ex,ey);
  if(!b||c<1e-12)return out;
  const th=4*Math.atan(b),h=(c/2)/Math.tan(th/2),cx=(x1+x2)/2-ey/c*h,cy=(y1+y2)/2+ex/c*h;
  const r=Math.hypot(x1-cx,y1-cy),a1=Math.atan2(y1-cy,x1-cx),n=Math.max(3,Math.ceil(Math.abs(th)/0.2));
  for(let i=1;i<n;i++){const a=a1+th*i/n;out.push(cx+r*Math.cos(a),cy+r*Math.sin(a));}
  return out;
}
function polyPts(e){
  const out=[],n=e.pts.length/2;
  for(let i=0;i<n;i++){
    out.push(e.pts[2*i],e.pts[2*i+1]);
    const j=i+1<n?i+1:(e.closed?0:-1);
    if(j>=0&&e.bl[i])out.push(...bulgeMid(e.pts[2*i],e.pts[2*i+1],e.pts[2*j],e.pts[2*j+1],e.bl[i]));
  }
  if(e.closed)out.push(e.pts[0],e.pts[1]);
  return out;
}
function arcPts(cx,cy,r,a1,a2){
  if(a2<=a1)a2+=360;
  const n=Math.max(6,Math.ceil((a2-a1)/10)),out=[];
  for(let i=0;i<=n;i++){const a=(a1+(a2-a1)*i/n)*Math.PI/180;out.push(cx+r*Math.cos(a),cy+r*Math.sin(a));}
  return out;
}
const IDENT=[1,0,0,1,0,0];
function mmul(m,l){return [m[0]*l[0]+m[2]*l[1],m[1]*l[0]+m[3]*l[1],m[0]*l[2]+m[2]*l[3],m[1]*l[2]+m[3]*l[3],m[0]*l[4]+m[2]*l[5]+m[4],m[1]*l[4]+m[3]*l[5]+m[5]];}
function tx(m,p){const o=new Array(p.length);for(let i=0;i<p.length;i+=2){o[i]=+(m[0]*p[i]+m[2]*p[i+1]+m[4]).toFixed(4);o[i+1]=+(m[1]*p[i]+m[3]*p[i+1]+m[5]).toFixed(4);}return o;}
function flatten(ents,m,depth,out,blocks){
  for(const e of ents){
    if(e.t==='L')out.push(tx(m,e.pts));
    else if(e.t==='P')out.push(tx(m,polyPts(e)));
    else if(e.t==='A')out.push(tx(m,arcPts(e.c[0],e.c[1],e.r,e.a1,e.a2)));
    else if(e.t==='I'&&depth<6){
      const b=blocks[e.name];if(!b)continue;
      const r=e.rot*Math.PI/180,c=Math.cos(r),s=Math.sin(r),l=[c*e.sx,s*e.sx,-s*e.sy,c*e.sy,0,0];
      l[4]=e.p[0]-(l[0]*b.bx+l[2]*b.by);l[5]=e.p[1]-(l[1]*b.bx+l[3]*b.by);
      flatten(b.ents,mmul(m,l),depth+1,out,blocks);
    }
  }
}
function mkGroup(paths){
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const p of paths)for(let i=0;i<p.length;i+=2){if(p[i]<x0)x0=p[i];if(p[i]>x1)x1=p[i];if(p[i+1]<y0)y0=p[i+1];if(p[i+1]>y1)y1=p[i+1];}
  return {paths,cx:(x0+x1)/2,cy:(y0+y1)/2,hw:(x1-x0)/2,hh:(y1-y0)/2,dx:0,dy:0};
}

/* ---- model ---- */
const DECOR_RE=/furn|equip|mob|plant|tree|car|sanit|fixture|elec|defpoints|title|border|dim|grid|axis|note/i;
function layerStats(DX){
  const st={};
  for(const e of DX.ents)st[e.layer]=(st[e.layer]||0)+1;
  return st;
}
function defaultRoles(DX){
  const roles={};
  for(const k in layerStats(DX))roles[k]=/^(SITE-|WALL-FILL$)/i.test(k)?'hide':DECOR_RE.test(k)?'decor':'structure';
  return roles;
}
function buildModel(DX,roles,unit,name){
  const M={v:1,name:name||'Plan',unit:unit||'cm',th:[],thAll:[],P:[],P0:null,segs:[],arcs:[],texts:[],fills:[],decor:[],dims:[],diags:[],nid:1,pl:0.012/UNIT_M[unit||'cm'],fin:false};
  const addP=(x,y)=>{M.P.push(x,y);return M.P.length/2-1;};
  for(const e of DX.ents){
    const role=roles[e.layer]||'structure';
    if(role==='hide')continue;
    if(e.t==='I'||(role==='decor'&&(e.t==='L'||e.t==='P'||e.t==='A'))){
      const paths=[];flatten([e],IDENT,0,paths,DX.blocks);
      if(paths.length)M.decor.push(mkGroup(paths));
      continue;
    }
    if(e.t==='T'){M.texts.push({p:addP(e.p[0],e.p[1]),h:e.h,s:e.s,rot:e.rot,ha:e.ha,va:e.va,room:role==='structure'});continue;}
    if(e.t==='H'){
      if(e.solid)M.fills.push(e.paths.map(pp=>{const ix=[];for(let i=0;i<pp.length;i+=2)ix.push(addP(pp[i],pp[i+1]));return ix;}));
      continue;
    }
    if(e.t==='L'){
      if(Math.hypot(e.pts[2]-e.pts[0],e.pts[3]-e.pts[1])<1e-9)continue;
      M.segs.push([addP(e.pts[0],e.pts[1]),addP(e.pts[2],e.pts[3]),0]);
    }else if(e.t==='P'){
      const ix=[],n=e.pts.length/2;
      for(let i=0;i<n;i++)ix.push(addP(e.pts[2*i],e.pts[2*i+1]));
      for(let i=0;i<n-1;i++)M.segs.push([ix[i],ix[i+1],e.bl[i]||0]);
      if(e.closed&&n>2)M.segs.push([ix[n-1],ix[0],e.bl[n-1]||0]);
    }else if(e.t==='A'){
      M.arcs.push([addP(e.c[0],e.c[1]),e.r,e.a1,e.a2]);
    }
  }
  M.P0=M.P.slice();
  return M;
}
function structBBox(M){
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const s of M.segs)for(let j=0;j<2;j++){const x=M.P[2*s[j]],y=M.P[2*s[j]+1];if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  if(x0===Infinity)return null;
  return [x0,y0,x1,y1];
}
/* spacing between parallel overlapping wall lines, weighted by overlap length */
function spacings(M,maxD){
  const H=[],V=[],P=M.P,w=new Map();
  for(const s of M.segs){
    if(s[2]||s[3])continue;
    const x1=P[2*s[0]],y1=P[2*s[0]+1],x2=P[2*s[1]],y2=P[2*s[1]+1],len=Math.hypot(x2-x1,y2-y1);
    if(Math.abs(y2-y1)<=1e-5*len)H.push([y1,Math.min(x1,x2),Math.max(x1,x2)]);
    else if(Math.abs(x2-x1)<=1e-5*len)V.push([x1,Math.min(y1,y2),Math.max(y1,y2)]);
  }
  for(const S of [H,V]){
    S.sort((a,b)=>a[0]-b[0]);
    for(let i=0;i<S.length;i++)for(let j=i+1;j<S.length;j++){
      const d=S[j][0]-S[i][0];
      if(d>maxD)break;
      if(d<1e-9)continue;
      const ov=Math.min(S[i][2],S[j][2])-Math.max(S[i][1],S[j][1]);
      if(ov>0.5*d){const k=Number(d.toPrecision(4));w.set(k,(w.get(k)||0)+ov);}
    }
  }
  return w;
}
function guessUnit(M){
  const w=spacings(M,450);let best=null,bw=0;
  for(const [u,lo,hi] of [['m',0.07,0.45],['cm',7,45],['mm',70,450]])
    for(const [d,wt] of w)if(d>=lo&&d<=hi&&wt>bw){bw=wt;best=u;}
  if(best)return best;
  const b=structBBox(M);if(!b)return 'cm';

function loadProject(obj){
  if(!obj||!obj.P||!obj.segs){toast('Not a Site Plan project file');return;}
  M=obj;fixModel(M);DX=null;hist=[];cand=[];hideSheet();refreshHeader();fit();autosave();toast('Project loaded');
}
function download(name,text,type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type}));
  a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
const saveFile=()=>download(M.name+'.siteplan.json',JSON.stringify(M),'application/json');
function printReport(){
  $('print').innerHTML=reportHTML(M,new Date().toLocaleDateString());
  setTimeout(()=>window.print(),150);
}
$('file').addEventListener('change',async ev=>{
  const f=ev.target.files[0];ev.target.value='';if(!f)return;
  const text=await f.text();
  if(text.trimStart().startsWith('{')){try{loadProject(JSON.parse(text));}catch(e){toast('Could not read project file');}}
  else importDXF(text,f.name);
});
const pickFile=()=>$('file').click();

/* ---- setup sheet ---- */
function openSetup(first){
  const canLayers=DX&&!M.dims.length;
  let h='<h3>Plan setup</h3>';
  h+='<label class="f">Drawing units</label><select id="sUnit">'+Object.keys(UNIT_M).map(u=>'<option'+(u===M.unit?' selected':'')+'>'+u+'</option>').join('')+'</select>';
  h+='<label class="f">Wall thicknesses ('+M.unit+') &ndash; tap to switch on or off</label><div id="sTh">';
  const all=[...new Set([...M.thAll,...M.th])].sort((a,b)=>a-b);
  h+=all.map(t=>'<span class="chip'+(M.th.includes(t)?' on':'')+'" data-t="'+t+'">'+t+'</span>').join('')||'<span class="hint">None detected</span>';
  h+='</div><div class="row"><input type="text" inputmode="decimal" id="sAdd" placeholder="Add thickness"><button id="sAddB" style="flex:0 0 80px">Add</button></div>';
  h+='<label class="f">Site sizes are measured on</label><select id="sFin"><option value="0">Bare walls (unplastered)</option><option value="1"'+(M.fin?' selected':'')+'>Finished surfaces (plastered)</option></select>';
  h+='<label class="f">Plaster thickness per face ('+M.unit+')</label><input type="text" inputmode="decimal" id="sPl" value="'+(+M.pl.toFixed(4))+'">';
  if(canLayers){
    const st=layerStats(DX);
    h+='<label class="f">Layers &ndash; walls and columns should be Structure</label>';
    h+=Object.keys(st).sort().map(k=>'<div class="lay"><span>'+esc(k)+' ('+st[k]+')</span><select data-l="'+esc(k)+'">'+
      ['structure','decor','hide'].map(r=>'<option value="'+r+'"'+(roles[k]===r?' selected':'')+'>'+({structure:'Structure',decor:'Furniture',hide:'Hide'}[r])+'</option>').join('')+'</select></div>').join('');
  }
  h+='<p class="hint">'+M.segs.length+' wall lines, '+M.decor.length+' furniture items, '+M.texts.length+' labels.</p>';
  h+='<div class="row" style="margin-top:10px"><button class="pri" id="sDone">'+(first?'Start measuring':'Done')+'</button></div>';
  showSheet(h,'top');
  $('sUnit').onchange=ev=>{M.unit=ev.target.value;M.pl=0.012/UNIT_M[M.unit];detectThickness(M);addJambs(M);changed();openSetup(first);};
  $('sFin').onchange=ev=>{M.fin=ev.target.value==='1';autosave();};
  $('sPl').onchange=ev=>{const v=parseFloat(ev.target.value.replace(',','.'));if(v>=0){M.pl=v;changed();}};
  sheet.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
    const t=+c.dataset.t,i=M.th.indexOf(t);if(i>=0)M.th.splice(i,1);else M.th.push(t);c.classList.toggle('on');addJambs(M);autosave();});
  $('sAddB').onclick=()=>{const v=parseFloat($('sAdd').value.replace(',','.'));if(v>0&&!M.th.includes(v)){M.th.push(v);addJambs(M);autosave();openSetup(first);}};
  sheet.querySelectorAll('select[data-l]').forEach(s=>s.onchange=()=>{roles[s.dataset.l]=s.value;rebuild();openSetup(first);});
  $('sDone').onclick=()=>{hideSheet();if(first)toast('Tap inside a room to measure it',3500);};
}

/* ---- probe + edit ---- */
function dimName(d){
  const g=dimLine(d),v=dimVal(M,d,M.P),e=epsOf(M)*2;
  if(M.th.some(t=>Math.abs(t-v)<=e))return 'Wall thickness';
  const room=nearestRoom(M,(g[0]+g[2])/2,(g[1]+g[3])/2);
  return (room||'Space')+(d.ax==='x'?' ↔':' ↕');
}
const findDim=c=>M.dims.find(d=>d.ax===c.ax&&d.a===c.a&&d.b===c.b);
function candSheet(title,extra){
  let h='<h3>'+esc(title)+'</h3>';
  cand.forEach((c,i)=>{
    const ex=findDim(c),cur=dimVal(M,c,M.P),des=dimVal(M,c,M.P0);
    h+='<button class="big" data-i="'+i+'" style="margin-bottom:8px">'+(c.ax==='x'?'↔ ':'↕ ')+fmt(M,cur)+' '+M.unit+
      '<small>'+esc(c.name||dimName(c))+(Math.abs(cur-des)>epsOf(M)/2?' · drawing '+fmt(M,des):'')+(ex?' · already measured':'')+'</small></button>';
  });
  h+=(extra||'')+'<p class="hint">Tap a size to enter what you measured on site.</p>';
  showSheet(h,'bottom');
  sheet.querySelectorAll('.big').forEach(b=>b.onclick=()=>{const c=cand[+b.dataset.i],ex=findDim(c);cand=[c];draw();openEdit(ex||c,!ex);});
}
function showOpening(o,px,py){
  cand=openingDims(M,o,o.side);draw();
  candSheet(o.type,'<div class="row"><button id="pSide">Other side</button><button id="pRoom">Measure room</button></div>');
  $('pSide').onclick=()=>{o.side=-o.side;showOpening(o,px,py);};
  $('pRoom').onclick=()=>tap(px,py,true);
}
function tap(px,py,room){
  if(!M)return;
  for(const r of hits)if(px>=r.x-6&&px<=r.x+r.w+6&&py>=r.y-8&&py<=r.y+r.h+8){cand=[];if(r.g)openDiag(r.g,false);else openEdit(r.d,false);draw();return;}
  const wx=(px-W/2)/V.k+V.cx,wy=V.cy-(py-Hh/2)/V.k;
  if(!room){
    const o=findOpening(M,wx,wy,10/V.k);
    if(o){showOpening(o,px,py);return;}
    const c=rectAt(M,wx,wy);
    if(c){
      cand=columnDims(M,c);draw();
      candSheet('Column or block','<button id="pRoom" style="width:100%">Measure as a room instead</button>');
      $('pRoom').onclick=()=>tap(px,py,true);
      return;
    }
  }
  cand=probe(M,wx,wy);draw();
  if(!cand.length){hideSheet();toast('No parallel walls found on both sides here');return;}
  const cx=cand.find(c=>c.ax==='x'),cy=cand.find(c=>c.ax==='y'),p=M.fin?M.pl:0;
  candSheet('Measured here',cx&&cy?'<button id="pDiag" style="width:100%">Check diagonals (should be '+fmt(M,Math.hypot(dimVal(M,cx,M.P)-2*p,dimVal(M,cy,M.P)-2*p))+' '+M.unit+')</button>':'');
  if(cx&&cy)$('pDiag').onclick=()=>{
    const ex=M.diags.find(g=>g.xa===cx.a&&g.xb===cx.b&&g.ya===cy.a&&g.yb===cy.b);
    cand=[];draw();openDiag(ex||{xa:cx.a,xb:cx.b,ya:cy.a,yb:cy.b,name:nearestRoom(M,wx,wy)||'Space',d1:null,d2:null,fin:M.fin},!ex);
  };
}
function openEdit(d,isNew){
  const cur=dimVal(M,d,M.P),des=dimVal(M,d,M.P0),name=d.name||dimName(d);
  const pk=d.pk!=null?d.pk:(name==='Wall thickness'?-2:2),fin0=d.site!=null?!!d.fin:!!M.fin;
  let h='<h3>'+esc(name)+'</h3>';
  h+='<div class="kv"><span>Drawing</span><b>'+fmt(M,des)+' '+M.unit+'</b></div>';
  h+='<div class="kv"><span>Plan now</span><b>'+fmt(M,cur)+' '+M.unit+'</b></div>';
  h+='<label class="f">Site measurement ('+M.unit+')</label><input class="num" type="text" inputmode="decimal" id="eVal" value="'+(d.site!=null?fmt(M,d.fin?d.raw:d.site):'')+'" placeholder="'+fmt(M,cur)+'">';
  h+='<label class="f">Measured on</label><select id="eFin"><option value="0">Bare wall (unplastered)</option><option value="1"'+(fin0?' selected':'')+'>Finished surface (plastered)</option></select><p class="hint" id="eBare" style="margin-top:4px"></p>';
  h+='<label class="f">What moves</label><select id="eMode"><option value="auto">Auto (fewest conflicts)</option>'+
    candidates(M,d,0).map(c=>'<option value="'+c.key+'">'+c.label+'</option>').join('')+
    '<option value="none">Record only as a check, move nothing</option></select>';
  h+='<div class="row" style="margin-top:12px"><button id="eCancel">Cancel</button>'+(isNew?'':'<button id="eDel" class="danger">Remove</button>')+'<button class="pri" id="eOk">Apply</button></div>';
  showSheet(h,'top');
  const inp=$('eVal');setTimeout(()=>{inp.focus();inp.select();},50);
  const read=()=>{const v=parseFloat(inp.value.replace(',','.')),fin=$('eFin').value==='1';return {v,fin,s:fin?v+pk*M.pl:v};};
  const hint=()=>{const r=read();$('eBare').textContent=r.fin&&pk&&r.v>0?'Bare size used on the plan: '+fmt(M,r.s)+' '+M.unit+' (plaster '+fmt(M,M.pl)+' per face)':r.fin&&!pk?'Plaster does not change this distance.':'';};
  inp.oninput=hint;$('eFin').onchange=hint;hint();
  const apply=()=>{
    const r=read(),v=r.s;
    if(!(r.v>0&&v>0)){toast('Enter the measured size');return;}
    if($('eMode').value!=='none'&&Math.abs(v-cur)>0.1*cur&&!confirm('This changes the size by '+fmt(M,Math.abs(v-cur))+' '+M.unit+' (from '+fmt(M,cur)+' to '+fmt(M,v)+'). Apply?'))return;
    pushHist();
    if(isNew){
      M.P.push(d.ox,d.oy);M.P0.push(d.ox,d.oy);
      d={id:M.nid++,ax:d.ax,a:d.a,b:d.b,p:M.P.length/2-1,name,site:null,how:null,kind:d.kind||null,j1:d.j1,j2:d.j2,r:d.r,fixed:d.fixed,cap:d.cap};M.dims.push(d);
    }
    const c=setDimension(M,d,v,$('eMode').value);
    d.pk=pk;d.fin=r.fin;d.raw=r.v;
    cand=[];hideSheet();changed();
    const nc=conflicts(M,M.P,null);
    const what=d.how==='none'?'Recorded as a check, plan not changed':!c?'Recorded, no change needed':c.label+': '+fmt(M,Math.abs(c.op.move))+' '+M.unit;
    toast(what+(nc?' · '+nc+' conflict'+(nc>1?'s':'')+' (red)':''),nc?4500:2600);
  };
  $('eOk').onclick=apply;
  inp.onkeydown=ev=>{if(ev.key==='Enter')apply();};
  $('eCancel').onclick=()=>{cand=[];hideSheet();draw();};
  if(!isNew)$('eDel').onclick=()=>{pushHist();M.dims=M.dims.filter(q=>q!==d);hideSheet();changed();toast('Measurement removed (plan left as is)');};
}

function openDiag(g,isNew){
  const r=diagRect(M,g),pp=g.fin?M.pl:0,exp=Math.hypot(r[2]-r[0]-2*pp,r[3]-r[1]-2*pp);
  let h='<h3>'+esc(g.name)+' diagonals</h3>';
  h+='<div class="kv"><span>Room on plan</span><b>'+fmt(M,r[2]-r[0])+' \u00d7 '+fmt(M,r[3]-r[1])+' '+M.unit+'</b></div>';
  h+='<div class="kv"><span>Each diagonal should be</span><b>'+fmt(M,exp)+' '+M.unit+'</b></div>';
  h+='<label class="f">Diagonal 1: bottom-left to top-right ('+M.unit+')</label><input class="num" type="text" inputmode="decimal" id="g1" value="'+(g.d1!=null?fmt(M,g.d1):'')+'" placeholder="'+fmt(M,exp)+'">';
  h+='<label class="f">Diagonal 2: top-left to bottom-right ('+M.unit+')</label><input class="num" type="text" inputmode="decimal" id="g2" value="'+(g.d2!=null?fmt(M,g.d2):'')+'" placeholder="'+fmt(M,exp)+'">';
  h+='<p class="hint">Measure the room sizes first. This is a check only; the plan stays square.'+(g.fin?' Diagonals are taken between finished (plastered) corners.':'')+'</p>';
  h+='<div class="row" style="margin-top:12px"><button id="gCancel">Cancel</button>'+(isNew?'':'<button id="gDel" class="danger">Remove</button>')+'<button class="pri" id="gOk">Save</button></div>';
  showSheet(h,'top');
  $('gCancel').onclick=hideSheet;
  if(!isNew)$('gDel').onclick=()=>{pushHist();M.diags=M.diags.filter(q=>q!==g);hideSheet();changed();};
  $('gOk').onclick=()=>{
    const a=parseFloat($('g1').value.replace(',','.')),b=parseFloat($('g2').value.replace(',','.'));
    if(!(a>0&&b>0)){toast('Enter both diagonals');return;}
    pushHist();
    if(isNew){g.id=M.nid++;M.diags.push(g);}
    g.d1=a;g.d2=b;hideSheet();changed();
    const i=diagInfo(M,g);
    toast(i.ok?'Room is square':'Out of square by '+fmt(M,Math.abs(i.off))+' '+M.unit+(Math.abs(i.mis)>0.01/UNIT_M[M.unit]?', and diagonals do not fit the room size ('+(i.mis>0?'+':'')+fmt(M,i.mis)+')':''),4500);
  };
}

/* ---- list + menu ---- */
function openList(){
  if(!M){pickFile();return;}
  let h='<h3>Measurements</h3>';
  if(!M.dims.length)h+='<p class="hint">Nothing measured yet. Tap inside a room on the plan.</p>';
  else{
    const e=epsOf(M)*0.5;
    h+='<table><tr><th>Where</th><th>Drawing</th><th>Site</th><th>Diff</th></tr>';
    M.dims.forEach((d,i)=>{
      const des=dimVal(M,d,M.P0),cur=dimVal(M,d,M.P),dev=d.site-des,bad=Math.abs(cur-d.site)>e;
      h+='<tr data-i="'+i+'"'+(bad?' class="c"':'')+'><td>'+esc(d.name)+(bad?' (conflict)':'')+'</td><td>'+fmt(M,des)+'</td><td>'+fmt(M,d.site)+'</td><td>'+(dev>0?'+':'')+fmt(M,dev)+'</td></tr>';
    });
    h+='</table><p class="hint">Tap a row to open it. Red rows no longer match the plan because a later edit moved one of their walls.</p>';
  }
  const badD=M.dims.filter(d=>dimStatus(M,d).bad);
  if(badD.length){
    h+='<h3 style="margin-top:14px">Closure check</h3>';
    for(const d of badD){const st=dimStatus(M,d),c=chainFor(M,d);
      h+='<p class="hint" style="color:var(--bad)"><b>'+esc(d.name)+'</b>: measured '+fmt(M,d.site)+', plan gives '+fmt(M,st.cur)+'.'+(c?' '+esc(c.text)+', closure error '+(c.err>0?'+':'')+fmt(M,c.err)+'.':'')+'</p>';}
  }
  if(M.diags.length){
    h+='<h3 style="margin-top:14px">Diagonal check</h3><table><tr><th>Room</th><th>D1</th><th>D2</th><th>Result</th></tr>';
    M.diags.forEach((g,i)=>{const q=diagInfo(M,g);h+='<tr data-g="'+i+'"><td>'+esc(g.name)+'</td><td>'+fmt(M,g.d1)+'</td><td>'+fmt(M,g.d2)+'</td><td style="color:'+q.color+'">'+q.label+'</td></tr>';});
    h+='</table>';
  }
  h+='<div class="row" style="margin-top:10px"><button id="lClose">Close</button></div>';
  showSheet(h,'top');
  $('lClose').onclick=hideSheet;
  sheet.querySelectorAll('tr[data-g]').forEach(r=>r.onclick=()=>openDiag(M.diags[+r.dataset.g],false));
  sheet.querySelectorAll('tr[data-i]').forEach(r=>r.onclick=()=>{
    const d=M.dims[+r.dataset.i],g=dimLine(d);V.cx=(g[0]+g[2])/2;V.cy=(g[1]+g[3])/2;draw();openEdit(d,false);});
}
function openMenu(){
  let h='<h3>Menu</h3><div class="menu"><button id="mOpen">Open DXF or project file</button>';
  if(M)h+='<button id="mDxf">Export as-built DXF</button><button id="mPdf">Export PDF report</button><button id="mCsv">Export measurements (CSV for Excel)</button><button id="mSave">Save project file</button><button id="mFit">Fit plan to screen</button><button id="mSetup">Plan setup (units, wall thickness, layers)</button><button id="mReset" class="danger">Reset plan to the drawing</button>';
  h+='<button id="mClose">Close</button></div>';
  showSheet(h,'top');
  $('mOpen').onclick=()=>{hideSheet();pickFile();};
  $('mClose').onclick=hideSheet;
  if(M){
    $('mSave').onclick=()=>{hideSheet();saveFile();};
    $('mDxf').onclick=()=>{hideSheet();download(M.name+' as-built.dxf',exportDXF(M),'application/dxf');};
    $('mPdf').onclick=()=>{hideSheet();printReport();};
    $('mCsv').onclick=()=>{hideSheet();download(M.name+' measurements.csv',reportCSV(M),'text/csv');};
    $('mFit').onclick=()=>{hideSheet();fit();};
    $('mSetup').onclick=()=>openSetup(false);
    $('mReset').onclick=()=>{
      if(!confirm('Remove all site measurements and return to the original drawing?'))return;
      pushHist();M.P=M.P0.slice();M.decor.forEach(g=>{g.dx=0;g.dy=0;});M.dims=[];M.diags=[];hideSheet();changed();
    };
  }
}
$('bMenu').onclick=openMenu;$('bList').onclick=openList;$('bUndo').onclick=undo;$('bOpen0').onclick=pickFile;

/* ---- pointer input ---- */
const ptrs=new Map();let moved=false,pinch=null;
const local=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);const [x,y]=local(e);ptrs.set(e.pointerId,{x,y,sx:x,sy:y});
  if(ptrs.size===1)moved=false;else{moved=true;pinch=null;}
});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;
  const [x,y]=local(e),dx=x-p.x,dy=y-p.y;p.x=x;p.y=y;
  if(ptrs.size===1){
    if(!moved&&Math.hypot(x-p.sx,y-p.sy)>8)moved=true;
    if(moved){V.cx-=dx/V.k;V.cy+=dy/V.k;draw();}
  }else if(ptrs.size===2){
    const [a,b]=[...ptrs.values()],dist=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    if(pinch&&pinch.dist>0){zoomAt(mx,my,dist/pinch.dist);V.cx-=(mx-pinch.mx)/V.k;V.cy+=(my-pinch.my)/V.k;draw();}
    pinch={dist,mx,my};
  }
});
const up=e=>{
  const p=ptrs.get(e.pointerId);ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
  if(p&&!moved&&ptrs.size===0&&e.type==='pointerup')tap(p.x,p.y);
};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();const [x,y]=local(e);zoomAt(x,y,Math.exp(-e.deltaY*0.0015));draw();},{passive:false});
window.addEventListener('resize',resize);

/* ---- start ---- */
resize();refreshHeader();
const q=new URLSearchParams(location.search).get('load');
if(q)fetch(q).then(r=>r.text()).then(t=>importDXF(t,q.split('/').pop())).catch(()=>toast('Could not load '+q));
else DB.get('current').then(m=>{if(m&&m.P&&!M){M=m;fixModel(M);refreshHeader();fit();}}).catch(()=>{});
window.__sp={get M(){return M;},tap,fit,importDXF,view:()=>({cx:V.cx,cy:V.cy,k:V.k,W,H:Hh})};
})();
</script>
